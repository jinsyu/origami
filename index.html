<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>종이접기 교실</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root { --accent: #2f7d4a; --ink: #2b2622; --muted: #8a8177; --line: #e6dfd2; --card: #fffdf9; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; color: var(--ink);
      font-family: Pretendard, system-ui, -apple-system, sans-serif;
      background: radial-gradient(ellipse at 40% 30%, #fbf8f2 0%, #efe8dc 70%, #e8dfd0 100%);
      display: grid; grid-template-rows: auto 1fr; height: 100vh; overflow: hidden;
    }
    header { display: flex; align-items: center; gap: 16px; padding: 14px 22px; }
    header h1 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
    header h1 b { color: var(--accent); transition: color .3s; }
    #tabs { display: flex; gap: 4px; background: #e9e2d5; padding: 4px; border-radius: 12px; }
    .tab { border: 0; background: transparent; padding: 7px 14px; border-radius: 9px; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; }
    .tab.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    #paperInfo { margin-left: auto; color: var(--muted); font-size: 14px; }

    main { display: grid; grid-template-columns: 1fr 340px; min-height: 0; gap: 0; }
    .left { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; padding: 0 0 18px 22px; }
    .instruction { display: flex; gap: 14px; align-items: flex-start; padding: 6px 4px 0; min-height: 64px; }
    #badge { flex: none; background: var(--accent); color: #fff; font-weight: 800; font-size: 15px; padding: 6px 12px; border-radius: 999px; transition: background .3s; }
    #stepText { font-size: 21px; font-weight: 600; line-height: 1.45; letter-spacing: -0.01em; }
    #stage { position: relative; min-height: 0; }
    #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
    .hint { position: absolute; right: 8px; bottom: 6px; font-size: 12px; color: var(--muted); pointer-events: none; }

    .controls { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; box-shadow: 0 6px 20px rgba(60,40,10,.06); }
    #progress { width: 100%; accent-color: var(--accent); margin: 0 0 10px; }
    .btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .btns button { font: inherit; font-weight: 600; padding: 10px 16px; border-radius: 11px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
    .btns button:hover:not(:disabled) { border-color: #cfc5b4; }
    .btns button:disabled { opacity: .4; cursor: default; }
    #fold { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 120px; }
    #restart { margin-left: auto; }

    aside { border-left: 1px solid var(--line); background: rgba(255,253,249,.6); min-height: 0; display: flex; flex-direction: column; margin-left: 18px; }
    aside h2 { font-size: 14px; color: var(--muted); font-weight: 700; margin: 16px 20px 8px; }
    #stepList { list-style: none; margin: 0; padding: 0 12px 16px; overflow-y: auto; }
    #stepList li { display: flex; gap: 12px; padding: 10px 10px; border-radius: 12px; cursor: pointer; line-height: 1.45; font-size: 15px; color: var(--muted); }
    #stepList li:hover { background: #f4eee4; }
    #stepList .num { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid #d6ccbb; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
    #stepList li.done .num { background: #e9e2d5; border-color: #e9e2d5; }
    #stepList li.now { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.07); }
    #stepList li.now .num { background: var(--accent); border-color: var(--accent); color: #fff; }

    @media (max-width: 860px) {
      body { height: auto; overflow: auto; grid-template-rows: auto auto; }
      header { flex-wrap: wrap; padding: 12px 16px; }
      #paperInfo { margin-left: 0; width: 100%; }
      main { grid-template-columns: 1fr; }
      .left { padding: 0 16px 16px; grid-template-rows: auto 56vh auto; }
      #stepText { font-size: 18px; }
      aside { margin: 0 16px 24px; border: 1px solid var(--line); border-radius: 16px; }
      #stepList { max-height: none; }
    }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <header>
    <h1>종이접기 <b>교실</b></h1>
    <div id="tabs"></div>
    <span id="paperInfo"></span>
  </header>
  <main>
    <div class="left">
      <div class="instruction"><span id="badge"></span><span id="stepText"></span></div>
      <div id="stage">
        <canvas id="view"></canvas>
        <span class="hint">드래그: 돌려 보기 · 스크롤: 확대</span>
      </div>
      <div class="controls">
        <input id="progress" type="range" min="0" max="1" step="0.001" value="0" aria-label="접는 정도" />
        <div class="btns">
          <button id="prev">◀ 이전</button>
          <button id="fold">이 단계 접기</button>
          <button id="auto">▶ 자동 재생</button>
          <button id="restart">↺ 처음부터</button>
        </div>
      </div>
    </div>
    <aside>
      <h2>접는 순서</h2>
      <ol id="stepList"></ol>
    </aside>
  </main>
  <script type="module" src="src/main.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
