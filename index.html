<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>종이접기 교실</title>
  <meta name="description" content="색종이 한 장으로 따라 접는 3D 종이접기. 쉬운 강아지부터 학까지, 한 단계씩 움직이는 그림으로 배워요." />
  <meta name="theme-color" content="#e6ece4" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="종이접기 교실" />
  <meta property="og:title" content="종이접기 교실 - 한 단계씩 움직이는 3D 종이접기" />
  <meta property="og:description" content="강아지 얼굴부터 학·백합까지, 난이도 1~10의 작품을 접는 선과 방향을 먼저 보여 주고 3D로 천천히 접어 보여 줘요." />
  <meta property="og:url" content="https://origami.gyosil.app/" />
  <meta property="og:image" content="https://origami.gyosil.app/og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M8 56 32 8l24 48z' fill='%23d9483b'/%3E%3Cpath d='M32 8v48H8z' fill='%23b8392e'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="src/style.css" />
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>

  <!-- 작품 목록 -->
  <section id="gallery" class="view" hidden>
    <header class="g-head">
      <div class="g-intro">
        <h1 class="brand">종이접기 교실</h1>
        <p class="lede">색종이 한 장을 준비하세요. 접는 선과 방향을 먼저 보여 주고, 한 단계씩 천천히 접어 보여 줘요.</p>
      </div>
      <a id="heroLink" class="hero matgrid" href="#/" aria-label="시연 중인 작품 접으러 가기">
        <canvas id="heroCanvas" aria-hidden="true"></canvas>
        <span id="heroCaption" class="hero-cap"></span>
      </a>
    </header>
    <main id="main" class="g-main">
      <h2 class="g-title">쉬운 것부터 차례로</h2>
      <ol id="cards" class="cards"></ol>
    </main>
    <footer class="g-foot">
      <p>마우스로 끌면 종이를 돌려 볼 수 있어요. 키보드 ←·→로 단계를 넘기고 스페이스로 접어요.</p>
    </footer>
  </section>

  <!-- 접기 화면 -->
  <section id="viewer" class="view" hidden>
    <header class="v-head">
      <a class="back" href="#/">작품 목록</a>
      <div class="v-title">
        <h1 id="modelName"></h1>
        <span id="modelLevel" class="meter" aria-label=""></span>
      </div>
      <span id="paperInfo" class="paper-info"></span>
      <a id="printLink" class="print-link" href="#/">인쇄용 도면</a>
    </header>
    <div class="v-body">
      <div class="v-left">
        <div class="instruction" aria-live="polite">
          <span id="badge" class="badge"></span>
          <p id="stepText"></p>
        </div>
        <div id="stage" class="stage matgrid">
          <canvas id="view" aria-label="종이접기 3D 화면"></canvas>
          <div class="legend" id="legend" hidden>
            <span><i class="lg valley"></i>골짜기 접기</span>
            <span><i class="lg mountain"></i>산 접기</span>
          </div>
        </div>
        <div class="controls">
          <input id="progress" type="range" min="0" max="1" step="0.001" value="0" aria-label="이 단계에서 접은 정도" />
          <div class="btns">
            <button id="prev" type="button">이전 단계</button>
            <button id="fold" type="button" class="primary">이 단계 접기</button>
            <a id="nextModel" class="next-model" href="#/" hidden></a>
            <button id="auto" type="button">처음부터 끝까지 보기</button>
            <label class="speed">속도
              <select id="speed">
                <option value="0.6">느리게</option>
                <option value="1" selected>보통</option>
                <option value="1.6">빠르게</option>
              </select>
            </label>
          </div>
        </div>
      </div>
      <aside class="v-steps">
        <h2>접는 순서</h2>
        <ol id="stepList"></ol>
      </aside>
    </div>
  </section>

  <!-- 인쇄용 도면 -->
  <section id="print" class="view" hidden>
    <header class="p-head">
      <a id="printBack" class="back" href="#/">접기 화면으로</a>
      <button id="printBtn" type="button" class="p-btn">인쇄하기</button>
    </header>
    <main class="p-sheet">
      <div class="p-title">
        <h1 id="pName"></h1>
        <p id="pInfo"></p>
      </div>
      <ol id="pSteps" class="p-steps"></ol>
      <p class="p-legend"><span><i class="lg valley"></i>골짜기 접기</span><span><i class="lg mountain"></i>산 접기</span><span>origami.gyosil.app</span></p>
    </main>
  </section>

  <script type="module" src="src/main.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
