<!doctype html>
<!-- 공유 미리보기(og.jpg) 원본: 크롬 헤드리스로 1200x630 캡처 → jpg. http://localhost:5173/scripts/og.html --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:Pretendard,"Apple SD Gothic Neo",system-ui,sans-serif;background:#e3eadf;
background-image:linear-gradient(#cfd9cb 1px,transparent 1px),linear-gradient(90deg,#cfd9cb 1px,transparent 1px);background-size:30px 30px;color:#1e2b3a}
.left{position:absolute;left:64px;top:70px;width:520px}
.tag{display:inline-block;font-size:24px;font-weight:700;color:#fff;background:#e0703a;border-radius:999px;padding:8px 20px}
h1{margin:22px 0 0;font-size:92px;font-weight:800;letter-spacing:-2px;line-height:1.05}
p{margin:22px 0 0;font-size:32px;line-height:1.5;color:#33465a;font-weight:600}
.chips{margin-top:30px;display:flex;gap:10px}
.chips span{font-size:22px;font-weight:700;padding:8px 16px;border-radius:12px;background:#fff;box-shadow:0 2px 0 #cfd9cb}
.url{position:absolute;left:66px;bottom:44px;font-size:24px;font-weight:700;color:#5b6d7f}
.grid{position:absolute;right:48px;top:48px;display:grid;grid-template-columns:repeat(3,172px);gap:16px}
.card{width:172px;height:172px;background:#fbfcf9;border-radius:22px;box-shadow:0 6px 16px rgba(30,43,58,.12);display:flex;align-items:center;justify-content:center}
.card img{width:150px;height:150px}
</style></head><body>
<div class="left">
  <span class="tag">초등 수업 · 무료</span>
  <h1>종이접기 교실</h1>
  <p>색종이 한 장으로 60가지 작품<br>한 단계씩 움직이는 3D로 따라 접어요</p>
  <div class="chips"><span>입문</span><span>초급</span><span>중급</span><span>고급</span><span>🖨 인쇄 도면</span></div>
</div>
<div class="url">origami.gyosil.app</div>
<div class="grid">
  <div class="card"><img src="../thumbs/fox.webp"></div>
  <div class="card"><img src="../thumbs/crane.webp"></div>
  <div class="card"><img src="../thumbs/penguin.webp"></div>
  <div class="card"><img src="../thumbs/tyranno.webp"></div>
  <div class="card"><img src="../thumbs/crab.webp"></div>
  <div class="card"><img src="../thumbs/car.webp"></div>
  <div class="card"><img src="../thumbs/goldfish.webp"></div>
  <div class="card"><img src="../thumbs/tiger.webp"></div>
  <div class="card"><img src="../thumbs/rocket.webp"></div>
</div>
</body></html>
